name: deploy portfolio to github pages

on:
  push:
    branches: [redesign]
    paths:
      - 'frontend/**'
      - 'img/**'
      - 'logo*.png'
      - 'favicon.png'
      - 'style.css'
      - 'CNAME'
      - 'docs/legacy-checksums.json'
      - '.github/workflows/pages.yml'

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
        with:
          package_json_file: frontend/package.json
      - name: install dependencies
        run: pnpm install --frozen-lockfile
      - name: prepare original assets and thumbnails
        run: pnpm assets
      - name: test
        run: pnpm exec vitest run
      - name: check types
        run: pnpm exec tsc --noEmit
      - name: build production frontend
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
        run: |
          node --input-type=module -e 'if (!process.env.VITE_SUPABASE_URL?.startsWith("https://") || !process.env.VITE_SUPABASE_PUBLISHABLE_KEY?.startsWith("sb_publishable_")) throw new Error("configure the two frontend secrets before deployment");'
          pnpm exec vite build
          pnpm pages
      - name: configure pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - name: upload site
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: frontend/dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: publish
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
